<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banen Leiden–Katwijk</title>
<meta name="description" content="When and where you can swim laps between Noordwijk, Katwijk, Leiden and Wassenaar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06141F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column, phone first. A short agenda for the rest of the day sits on pool tiles,
   then every pool is a swim lane on a 07–22h time axis, separated by lane ropes. */
:root {
  --tile: #F2F7F9;        /* pool-deck tile */
  --grout: #E1EBF0;
  --surface: #FFFFFF;
  --ink: #0B2540;         /* lane-line navy */
  --muted: #587088;
  --line: #D5E1E8;
  --water: #1272C4;       /* lap-swim block */
  --water-soft: #DCEBF7;
  --water-ink: #FFFFFF;
  --rope-a: #1272C4;
  --rope-b: #F4F7F9;
  --rope-end: #D93A3F;    /* red floats at the wall, also the "now" hand */
  --now: #D93A3F;
  --open: #0E7F57;
  --warn: #7A5300;
  --warn-bg: #FFF1CC;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.625rem;
  --step-3: 2.75rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tile: #06141F; --grout: #0B1E2C; --surface: #0C2131; --ink: #E4EEF4; --muted: #8FA6B8;
    --line: #1C3447; --water: #3E9BEA; --water-soft: #12344E; --water-ink: #04121D;
    --rope-a: #3E9BEA; --rope-b: #C9D6DF; --rope-end: #F0585C; --now: #F0585C;
    --open: #45D19A; --warn: #F2C35B; --warn-bg: #2B230E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tile: #06141F; --grout: #0B1E2C; --surface: #0C2131; --ink: #E4EEF4; --muted: #8FA6B8;
  --line: #1C3447; --water: #3E9BEA; --water-soft: #12344E; --water-ink: #04121D;
  --rope-a: #3E9BEA; --rope-b: #C9D6DF; --rope-end: #F0585C; --now: #F0585C;
  --open: #45D19A; --warn: #F2C35B; --warn-bg: #2B230E; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--tile);
  color: var(--ink);
  font: 400 var(--step-0)/1.45 var(--font-body);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, a { color: inherit; font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; border-radius: 4px; }

.app {
  max-width: 44rem;
  margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ---- header ---- */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { margin: 0; font: 700 var(--step-2)/1 var(--font-display); letter-spacing: 0.01em; }
.clock { font: 600 var(--step-1)/1 var(--font-display); color: var(--muted); }

.days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.day {
  border: 0;
  background: transparent;
  border-radius: 10px;
  padding: 6px 0 7px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  color: var(--muted);
}
.day b { font: 600 var(--step-1)/1.1 var(--font-display); color: var(--ink); }
.day span { font-size: var(--step--1); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--tile); }
.day[aria-pressed="true"] b { color: var(--tile); }
.day.none b { color: var(--muted); font-weight: 500; }

/* ---- agenda on tiles ---- */
.agenda {
  position: relative;
  border-radius: 18px;
  padding: 18px 18px 16px;
  background-color: var(--surface);
  background-image:
    linear-gradient(var(--grout) 1px, transparent 1px),
    linear-gradient(90deg, var(--grout) 1px, transparent 1px);
  background-size: 22px 22px;
  background-position: -1px -1px;
  border: 1px solid var(--line);
}
.agenda h2 { margin: 0 0 10px; font: 600 var(--step-1)/1.2 var(--font-display); text-wrap: balance; }
.agenda .sub { margin: -6px 0 10px; color: var(--muted); font-size: var(--step--1); }
.agenda ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.agenda li {
  display: grid;
  grid-template-columns: 6.6rem minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}
.when { display: flex; flex-direction: column; line-height: 1; }
.when small { font-size: var(--step--1); color: var(--muted); margin-bottom: 2px; }
.when strong { font: 700 var(--step-3)/0.9 var(--font-display); letter-spacing: -0.01em; }
.agenda li.is-open .when small { color: var(--open); font-weight: 600; }
.agenda li .where { min-width: 0; }
.where b { display: block; font-weight: 600; }
.where span { color: var(--muted); font-size: var(--step--1); }
.tag {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px;
  font-size: 0.75rem; font-weight: 600; vertical-align: 1px;
  background: var(--warn-bg); color: var(--warn);
}
.more { margin: 10px 0 0; color: var(--muted); font-size: var(--step--1); }

/* ---- lanes ---- */
.lanes { display: flex; flex-direction: column; }
.axis { position: relative; height: 18px; margin-bottom: 4px; color: var(--muted); font: 500 var(--step--1)/1 var(--font-display); }
.axis span { position: absolute; transform: translateX(-50%); }
.rope {
  height: 5px; border-radius: 3px; margin-block: 2px;
  background:
    linear-gradient(90deg, var(--rope-end) 0 36px, transparent 36px calc(100% - 36px), var(--rope-end) calc(100% - 36px)),
    repeating-linear-gradient(90deg, var(--rope-a) 0 9px, var(--rope-b) 9px 18px);
  opacity: 0.85;
}
.pool { padding-block: 12px; }
.pool.is-quiet .head b, .pool.is-quiet .head .town { color: var(--muted); }
.head {
  width: 100%; border: 0; background: transparent; padding: 0; text-align: left;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.head .name { min-width: 0; }
.head b { font: 600 var(--step-1)/1.15 var(--font-display); }
.head .town { color: var(--muted); font-size: var(--step--1); margin-left: 6px; }
.status { flex: none; font-size: var(--step--1); font-weight: 600; color: var(--muted); }
.status.open { color: var(--open); }
.status.next { color: var(--ink); }

.track {
  position: relative; height: 26px; margin-top: 8px; border-radius: 6px;
  background-color: var(--water-soft);
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(100% / 15 - 1px), var(--line) calc(100% / 15 - 1px) calc(100% / 15));
  overflow: hidden;
}
.pool.is-quiet .track { background-color: transparent; border: 1px dashed var(--line); }
.seg { position: absolute; top: 0; bottom: 0; background: var(--water); border-radius: 4px; }
.seg.lim {
  background: repeating-linear-gradient(135deg, var(--water) 0 4px, color-mix(in srgb, var(--water) 45%, transparent) 4px 8px);
}
.seg.past { opacity: 0.3; }
.nowline { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--now); border-radius: 1px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 0; list-style: none; }
.chip {
  font: 600 0.9375rem/1 var(--font-display); letter-spacing: 0.02em;
  padding: 5px 8px; border-radius: 7px;
  background: var(--surface); border: 1px solid var(--line);
}
.chip.now { background: var(--water); color: var(--water-ink); border-color: var(--water); }
.chip.past { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.chip.lim::after { content: " *"; color: var(--warn); }
.chip.now.lim::after { color: inherit; }
.none-today { margin: 8px 0 0; color: var(--muted); font-size: var(--step--1); }

.flag {
  margin: 8px 0 0; padding: 6px 10px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn); font-size: var(--step--1); font-weight: 500;
}

.detail { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; font-size: 0.9375rem; }
.detail p { margin: 0; }
.detail dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; }
.detail dt { font: 600 var(--step-0)/1.45 var(--font-display); color: var(--muted); }
.detail dd { margin: 0; min-width: 0; }
.detail dd.today { font-weight: 600; }
.notes { margin: 0; padding-left: 1.1em; }
.notes li + li { margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px;
  text-decoration: none; font-weight: 600; font-size: 0.9375rem;
  border: 1px solid var(--line); background: transparent;
}
.btn.primary { background: var(--ink); color: var(--tile); border-color: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: var(--step--1); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--water); }
.legend i.lim { background: repeating-linear-gradient(135deg, var(--water) 0 3px, color-mix(in srgb, var(--water) 45%, transparent) 3px 6px); }
.legend i.now { width: 2px; background: var(--now); }

footer { color: var(--muted); font-size: var(--step--1); display: flex; flex-direction: column; gap: 8px; }
footer p { margin: 0; max-width: 60ch; }
.hidden-pools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hidden-pools button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: var(--step--1); }

@media (min-width: 640px) {
  .agenda li { grid-template-columns: 7.5rem minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .nowline { transition: left 0.6s ease; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">Banen</h1>
    <span class="clock" id="clock"></span>
  </header>
  <nav class="days" id="days" aria-label="Choose a day"></nav>
  <section class="agenda" id="agenda" aria-live="polite"></section>
  <section class="lanes" id="lanes" aria-label="Lap swimming per pool"></section>
  <footer id="foot"></footer>
</div>

<script>
// Lap-swim (banenzwemmen) times only: no recreational swimming, no lessons, no aqua classes.
// Checked on 2026-10-08 against each operator's own site or schedule feed.
const CHECKED = "2026-10-08";
const AXIS_START = 7 * 60, AXIS_END = 22 * 60;

// [weekday Mon=1..Sun=7, start, end, limited?, note]
const POOLS = [
  {
    id: "binnenzee", name: "BinnenZee", town: "Noordwijk",
    url: "https://binnenzee.sportfondsen.nl/tijden-tarieven/",
    price: "€8,50 single swim",
    about: "25 m pool. Some lanes are taken by aqua classes at the start of the morning. No lap swimming on Saturday.",
    slots: [
      [1, "09:00", "10:00", 1, "Only 2 lanes until 10:00"], [1, "10:00", "12:00", 0], [1, "19:00", "21:00", 1, "4 lanes"],
      [2, "07:00", "09:00", 0], [2, "09:00", "10:00", 1, "Only 3 lanes 09:00–10:00"], [2, "10:00", "11:00", 0],
      [3, "10:00", "12:00", 0],
      [4, "07:00", "12:00", 0],
      [5, "09:00", "10:00", 1, "Only 2 lanes until 10:00"], [5, "10:00", "12:00", 0],
      [5, "19:00", "20:00", 1, "3 lanes next to recreational swimming, none when it's disco swimming"],
      [7, "09:00", "10:00", 0], [7, "10:00", "11:00", 1, "3 lanes next to recreational swimming"],
    ],
  },
  {
    id: "aquamar", name: "Aquamar", town: "Katwijk",
    url: "https://zwembadaquamar.nl/schedule/openingstijden/",
    price: "€7,30 single swim",
    about: "10 lanes in the competition pool, at least 6 kept for lap swimmers. On Sundays, holidays and public holidays the afternoon is shared with recreational swimming.",
    slots: [
      [1, "07:30", "18:00", 0],
      [2, "07:30", "12:30", 0], [2, "12:30", "14:00", 1, "In the smaller multipurpose pool"], [2, "14:00", "20:30", 0],
      [3, "07:30", "13:30", 0], [3, "13:30", "16:00", 1, "2/3 of the pool available"],
      [4, "07:30", "18:00", 0],
      [5, "07:30", "18:00", 0], [5, "20:00", "22:00", 1, "In the smaller multipurpose pool"],
      [6, "10:00", "12:00", 0], [6, "13:00", "16:00", 1, "In the smaller multipurpose pool"],
      [7, "10:00", "12:00", 0], [7, "12:00", "16:00", 1, "At least 1 lane, shared with recreational swimming"],
    ],
    adjust({ ds, day, hol }) {
      // Published autumn-holiday schedule, Mon 19 – Fri 23 Oct 2026; weekend unchanged.
      if (ds >= "2026-10-19" && ds <= "2026-10-23") {
        return {
          segs: [
            seg("07:30", "12:00", 0),
            seg("12:00", day === 3 ? "16:00" : "17:00", 1, "At least 1 lane, shared with recreational swimming"),
          ],
          flag: "Autumn holiday times",
        };
      }
      if (hol) return { flag: `${hol.name}: afternoons shared with recreational swimming, check times` };
    },
  },
  {
    id: "poelmeer", name: "Poelmeer", town: "Oegstgeest",
    url: "https://www.optisport.nl/activiteiten/banenzwemmen/zwembad-poelmeer-oegstgeest",
    price: "€8,50 single swim",
    about: "Competition pool 25 × 12.5 m, 5 lanes.",
    slots: [
      [1, "08:30", "10:00", 0], [1, "12:00", "13:00", 0],
      [2, "07:00", "13:00", 0], [2, "19:30", "22:00", 0],
      [3, "08:30", "12:50", 0], [3, "20:15", "22:00", 0],
      [4, "07:00", "13:00", 0], [4, "20:00", "22:00", 0],
      [5, "07:00", "08:45", 0], [5, "10:00", "13:00", 0],
      [6, "12:00", "14:00", 0],
      [7, "11:00", "13:00", 0],
    ],
    adjust({ ds, hol }) {
      // Optisport's dated feed runs to 8 Dec 2026 and shows no autumn-holiday changes.
      if (hol && ds <= "2026-12-08") return {};
      if (hol) return { flag: `${hol.name}: times may differ, check the site` };
    },
  },
  {
    id: "zijl", name: "De Zijl", town: "Leiden",
    url: "https://www.sportinleiden.nl/zwemmen/locaties/de-zijl/",
    price: "€5,40 single swim",
    about: "25 m competition pool. No lap swimming on Saturday.",
    slots: [
      [1, "07:00", "08:30", 0], [1, "09:00", "13:30", 0],
      [2, "07:00", "08:30", 0], [2, "09:00", "13:30", 0], [2, "14:00", "15:30", 0],
      [3, "07:00", "08:30", 0], [3, "09:00", "13:30", 0], [3, "19:15", "20:30", 0],
      [4, "07:00", "08:30", 0], [4, "09:00", "13:30", 0],
      [5, "07:00", "08:30", 0], [5, "09:00", "13:30", 0], [5, "14:00", "15:30", 0],
      [7, "10:15", "12:00", 0],
    ],
  },
  {
    id: "vliet", name: "De Vliet", town: "Leiden",
    url: "https://www.sportinleiden.nl/zwemmen/locaties/zwembad-de-vliet/",
    price: "€5,40 single swim",
    about: "Indoor pool, two 25 m basins with up to 14 lanes. Aqua classes sometimes use part of the water during lap swimming. Closed on Saturday.",
    slots: [
      [1, "07:00", "11:00", 0], [1, "12:30", "15:30", 0, "Shallow-water swimming 14:00–15:00 at the same time"], [1, "19:00", "20:30", 0],
      [2, "07:00", "12:00", 0], [2, "12:30", "16:00", 0, "Shallow-water swimming 12:45–15:30 at the same time"], [2, "19:00", "20:30", 0],
      [3, "07:00", "12:00", 0],
      [4, "07:00", "12:00", 0], [4, "12:30", "15:30", 0], [4, "19:15", "20:45", 0],
      [5, "07:00", "11:00", 0], [5, "12:30", "16:00", 0, "Shallow-water swimming 12:30–15:30 at the same time"], [5, "19:15", "20:30", 0],
      [7, "10:30", "13:30", 0],
    ],
  },
  {
    id: "wedde", name: "Het Wedde", town: "Voorschoten",
    url: "https://wedde.sportfondsen.nl/tijden-tarieven-van-het-wedde/",
    price: "€7,30 online, €7,80 at the desk",
    about: "25 m competition pool. Mornings from Wednesday to Friday are shared with recreational swimming, and lanes may be shorter than full length. 07:00–08:00 is a quiet hour. Closed on Saturday.",
    slots: [
      [1, "07:00", "09:30", 1, "Shared with recreational swimming"], [1, "10:30", "13:00", 0], [1, "21:00", "22:00", 1, "Shared with recreational swimming"],
      [2, "07:00", "13:00", 0], [2, "20:00", "22:00", 0, "Usually busy 20:00–21:00"],
      [3, "07:00", "13:00", 1, "Lanes not always full length"], [3, "21:00", "22:00", 1, "Shared with recreational swimming"],
      [4, "07:00", "13:00", 1, "Shared with recreational swimming, lanes not always full length"], [4, "20:00", "22:00", 0],
      [5, "07:00", "13:00", 1, "Shared with recreational swimming, lanes not always full length"],
      [5, "21:00", "22:00", 1, "Shared with recreational swimming. In the printed timetable, not on the website"],
      [7, "09:30", "11:00", 0],
    ],
    adjust({ segs, hol }) {
      // In school holidays (not summer) the morning session ends at 12:00 instead of 13:00.
      if (!hol) return;
      return {
        segs: segs.map(s => s.e === 13 * 60 && s.s < 12 * 60 ? { ...s, e: 12 * 60 } : s),
        flag: `${hol.name}: mornings end at 12:00`,
      };
    },
  },
  {
    id: "sterrenbad", name: "Sterrenbad", town: "Wassenaar",
    url: "https://sterrenbad.sportfondsen.nl/tijden-tarieven/",
    price: "€8,90 single swim",
    about: "Competition pool at 28 °C, lanes split into faster and slower swimmers.",
    slots: [
      [1, "07:30", "08:45", 0], [1, "12:35", "13:15", 0], [1, "19:30", "20:15", 0],
      [2, "07:30", "09:30", 0], [2, "12:00", "13:30", 0], [2, "20:15", "21:00", 0, "On the website, not in the printed timetable"],
      [3, "07:30", "09:00", 0], [3, "12:00", "13:00", 0], [3, "19:30", "20:15", 0],
      [4, "07:30", "09:30", 0], [4, "12:00", "13:00", 0],
      [5, "07:30", "09:30", 0], [5, "12:00", "13:00", 0],
      [6, "07:30", "08:10", 0],
      [7, "09:00", "10:00", 0],
    ],
  },
];

// School holidays for the Leiden region (regio midden) and public holidays in the data window.
const HOLIDAYS = [
  { name: "Autumn holiday", from: "2026-10-17", to: "2026-10-25" },
  { name: "Christmas holiday", from: "2026-12-19", to: "2027-01-03" },
];
const PUBLIC_HOLIDAYS = { "2026-12-25": "Christmas Day", "2026-12-26": "Boxing Day", "2027-01-01": "New Year's Day" };

const DAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_LONG = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

const pad = n => String(n).padStart(2, "0");
const toMin = t => { const [h, m] = t.split(":"); return h * 60 + Number(m); };
const fmt = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dow = d => ((d.getDay() + 6) % 7) + 1;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const seg = (s, e, lim, note = "") => ({ s: toMin(s), e: toMin(e), lim: !!lim, note });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function slotsFor(p, date) {
  const ds = iso(date), day = dow(date);
  let segs = p.slots.filter(x => x[0] === day).map(([, s, e, l, n]) => seg(s, e, l, n));
  const flags = [];
  const hol = HOLIDAYS.find(h => ds >= h.from && ds <= h.to);
  const r = p.adjust ? p.adjust({ date, ds, day, segs, hol }) : undefined;
  if (r) { if (r.segs) segs = r.segs; if (r.flag) flags.push(r.flag); }
  else if (hol) flags.push(`${hol.name}: times may differ, check the site`);
  if (PUBLIC_HOLIDAYS[ds]) flags.push(`${PUBLIC_HOLIDAYS[ds]}: check whether the pool is open`);
  return { segs, flags, blocks: mergeBlocks(segs) };
}

// Join back-to-back segments into one session, e.g. 09:00–10:00 (limited) + 10:00–12:00.
function mergeBlocks(segs) {
  const out = [];
  for (const s of [...segs].sort((a, b) => a.s - b.s)) {
    const last = out[out.length - 1];
    if (last && last.e === s.s) { last.e = s.e; last.parts.push(s); last.lim ||= s.lim; }
    else out.push({ s: s.s, e: s.e, lim: s.lim, parts: [s] });
  }
  return out;
}

// ---- state ----
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let hidden = new Set(store.get("banen.hidden", []));
let offset = 0;                 // selected day, 0 = today
const open = new Set();         // expanded pools
let lastToday = iso(new Date());

const visiblePools = () => POOLS.filter(p => !hidden.has(p.id));
const pct = m => ((Math.min(Math.max(m, AXIS_START), AXIS_END) - AXIS_START) / (AXIS_END - AXIS_START)) * 100;
const dateLabel = d => `${DAY_LONG[dow(d) - 1]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;

function render() {
  const now = new Date();
  if (iso(now) !== lastToday) { lastToday = iso(now); offset = 0; }
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const date = addDays(now, offset);
  const isToday = offset === 0;
  const pools = visiblePools().map(p => ({ p, ...slotsFor(p, date) }));

  document.getElementById("clock").textContent = fmt(nowMin);
  renderDays(now);
  renderAgenda(pools, date, isToday, nowMin, now);
  renderLanes(pools, isToday, nowMin, date);
  renderFoot();
}

function renderDays(now) {
  const el = document.getElementById("days");
  el.innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(now, i);
    const any = visiblePools().some(p => slotsFor(p, d).segs.length);
    const label = i === 0 ? "Today" : DAY_SHORT[dow(d) - 1];
    return `<button class="day${any ? "" : " none"}" data-off="${i}" aria-pressed="${i === offset}" aria-label="${esc(dateLabel(d))}">
      <span>${label}</span><b>${d.getDate()}</b></button>`;
  }).join("");
}

function agendaRow({ p, b }, mode) {
  const label = mode === "open" ? "until" : "from";
  const time = mode === "open" ? fmt(b.e) : fmt(b.s);
  const range = mode === "open" ? "" : ` to ${fmt(b.e)}`;
  return `<li class="${mode === "open" ? "is-open" : ""}">
    <span class="when"><small>${mode === "open" ? "Open now, until" : label}</small><strong>${time}</strong></span>
    <span class="where"><b>${esc(p.name)}${b.lim ? '<span class="tag">limited lanes</span>' : ""}</b>
    <span>${esc(p.town)}${range}</span></span></li>`;
}

function renderAgenda(pools, date, isToday, nowMin, now) {
  const el = document.getElementById("agenda");
  const all = pools.flatMap(({ p, blocks }) => blocks.map(b => ({ p, b })));
  if (isToday) {
    const openNow = all.filter(x => x.b.s <= nowMin && x.b.e > nowMin).sort((a, b) => b.b.e - a.b.e);
    const later = all.filter(x => x.b.s > nowMin).sort((a, b) => a.b.s - b.b.s);
    if (openNow.length || later.length) {
      const shown = later.slice(0, Math.max(2, 5 - openNow.length));
      const rest = later.length - shown.length;
      el.innerHTML = `<h2>${openNow.length ? `You can swim laps now at ${openNow.length === 1 ? "1 pool" : openNow.length + " pools"}` : "Next lap swimming today"}</h2>
        <ol>${openNow.map(x => agendaRow(x, "open")).join("")}${shown.map(x => agendaRow(x, "later")).join("")}</ol>
        ${rest > 0 ? `<p class="more">${rest} more ${rest === 1 ? "session" : "sessions"} later today, see the lanes below.</p>` : ""}`;
      return;
    }
    // Nothing left today: point to tomorrow.
    const tm = addDays(now, 1);
    const next = visiblePools().flatMap(p => slotsFor(p, tm).blocks.map(b => ({ p, b }))).sort((a, b) => a.b.s - b.b.s).slice(0, 3);
    el.innerHTML = `<h2>No more lap swimming today</h2>
      ${next.length ? `<p class="sub">First sessions tomorrow</p><ol>${next.map(x => agendaRow(x, "later")).join("")}</ol>` : `<p class="sub">Tomorrow has no lap swimming either.</p>`}`;
    return;
  }
  const withSwim = pools.filter(x => x.blocks.length);
  const first = [...all].sort((a, b) => a.b.s - b.b.s).slice(0, 3);
  el.innerHTML = `<h2>${dateLabel(date)}</h2>
    <p class="sub">${withSwim.length ? `Lap swimming at ${withSwim.length} of ${pools.length} pools. Earliest sessions:` : "No lap swimming at any pool on this day."}</p>
    ${first.length ? `<ol>${first.map(x => agendaRow(x, "later")).join("")}</ol>` : ""}`;
}

function poolStatus(blocks, isToday, nowMin) {
  if (!blocks.length) return { cls: "", text: "No lap swimming" };
  if (!isToday) return { cls: "next", text: `${blocks.length} ${blocks.length === 1 ? "session" : "sessions"}` };
  const cur = blocks.find(b => b.s <= nowMin && b.e > nowMin);
  if (cur) return { cls: "open", text: `Open until ${fmt(cur.e)}` };
  const nxt = blocks.find(b => b.s > nowMin);
  if (nxt) return { cls: "next", text: `Next at ${fmt(nxt.s)}` };
  return { cls: "", text: "Done for today" };
}

function weekRows(p, date) {
  const today = dow(date);
  return [1, 2, 3, 4, 5, 6, 7].map(d => {
    const bl = mergeBlocks(p.slots.filter(x => x[0] === d).map(([, s, e, l, n]) => seg(s, e, l, n)));
    const txt = bl.length ? bl.map(b => `${fmt(b.s)}–${fmt(b.e)}${b.lim ? " *" : ""}`).join(", ") : "None";
    return `<dt>${DAY_SHORT[d - 1]}</dt><dd class="${d === today ? "today" : ""}">${txt}</dd>`;
  }).join("");
}

function renderLanes(pools, isToday, nowMin, date) {
  const el = document.getElementById("lanes");
  const ticks = [8, 10, 12, 14, 16, 18, 20].map(h => `<span style="left:${pct(h * 60)}%">${h}</span>`).join("");
  const showNow = isToday && nowMin >= AXIS_START && nowMin <= AXIS_END;
  const rows = pools.map(({ p, segs, blocks, flags }) => {
    const st = poolStatus(blocks, isToday, nowMin);
    const segHtml = segs.map(s => {
      const past = isToday && s.e <= nowMin;
      return `<span class="seg${s.lim ? " lim" : ""}${past ? " past" : ""}" style="left:${pct(s.s)}%;width:${pct(s.e) - pct(s.s)}%"></span>`;
    }).join("");
    const chips = blocks.map(b => {
      const state = isToday ? (b.e <= nowMin ? " past" : b.s <= nowMin ? " now" : "") : "";
      return `<li class="chip${state}${b.lim ? " lim" : ""}">${fmt(b.s)}–${fmt(b.e)}</li>`;
    }).join("");
    const notes = segs.filter(s => s.note).map(s => `<li><b>${fmt(s.s)}–${fmt(s.e)}</b> ${esc(s.note)}</li>`).join("");
    const isOpen = open.has(p.id);
    return `<article class="pool${blocks.length ? "" : " is-quiet"}">
      <button class="head" data-toggle="${p.id}" aria-expanded="${isOpen}" aria-controls="d-${p.id}">
        <span class="name"><b>${esc(p.name)}</b><span class="town">${esc(p.town)}</span></span>
        <span class="status ${st.cls}">${st.text}</span>
      </button>
      <div class="track" aria-hidden="true">${segHtml}${showNow ? `<span class="nowline" style="left:${pct(nowMin)}%"></span>` : ""}</div>
      ${blocks.length ? `<ul class="chips" aria-label="Lap swimming times">${chips}</ul>` : `<p class="none-today">No lap swimming on ${DAY_LONG[dow(date) - 1]}.</p>`}
      ${flags.map(f => `<p class="flag">${esc(f)}</p>`).join("")}
      <div class="detail" id="d-${p.id}" ${isOpen ? "" : "hidden"}>
        ${notes ? `<ul class="notes">${notes}</ul>` : ""}
        <p>${esc(p.about)}</p>
        <p>${esc(p.price)}. No booking needed.</p>
        <dl aria-label="Regular week">${weekRows(p, date)}</dl>
        <div class="actions">
          <a class="btn primary" href="${p.url}" target="_blank" rel="noopener">Open pool timetable</a>
          <button class="btn" data-hide="${p.id}">Hide this pool</button>
        </div>
      </div>
    </article>`;
  });
  el.innerHTML = `<div class="axis" aria-hidden="true">${ticks}</div>${rows.join('<div class="rope" aria-hidden="true"></div>')}
    <div class="legend" aria-hidden="true"><span><i></i>Lap swimming</span><span><i class="lim"></i>Limited lanes or shared</span>${showNow ? '<span><i class="now"></i>Now</span>' : ""}</div>`;
}

function renderFoot() {
  const el = document.getElementById("foot");
  const hiddenPools = POOLS.filter(p => hidden.has(p.id));
  const ageDays = Math.floor((Date.now() - new Date(CHECKED + "T12:00:00")) / 864e5);
  el.innerHTML = `
    ${ageDays > 90 ? `<p class="flag">These times were checked ${ageDays} days ago. Pools change their timetables a few times a year, so check before you go.</p>` : ""}
    <p>Lap swimming only. Times were checked on 8 October 2026 on each pool's own website. Tap a pool for notes, prices and its timetable.</p>
    <p>Closed for now: De Does in Leiderdorp (renovation until about February 2027) and the outdoor 50 m pool at De Vliet (reopens in May).</p>
    ${hiddenPools.length ? `<div class="hidden-pools"><span>Hidden:</span>${hiddenPools.map(p => `<button data-show="${p.id}">Show ${esc(p.name)}</button>`).join("")}</div>` : ""}`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-off],[data-toggle],[data-hide],[data-show]");
  if (!t) return;
  if (t.dataset.off) offset = Number(t.dataset.off);
  else if (t.dataset.toggle) { const id = t.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); }
  else if (t.dataset.hide) { hidden.add(t.dataset.hide); open.delete(t.dataset.hide); store.set("banen.hidden", [...hidden]); }
  else if (t.dataset.show) { hidden.delete(t.dataset.show); store.set("banen.hidden", [...hidden]); }
  render();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
setInterval(render, 30000);
</script>
</body>
</html>
