name: Refresh swim times

on:
  schedule:
    - cron: "15 4 * * *"   # daily, 05:15/06:15 Dutch time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-times.mjs
      - name: Commit times.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add times.json
          git diff --cached --quiet || git commit -m "Refresh swim times"
          git push
